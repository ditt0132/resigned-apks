name: Mirror and re-sign releases

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:

concurrency:
  group: resign
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out configuration
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # Most five-minute runs stop here and do not download the Android SDK/build-tools.
      - name: Check upstream release metadata
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: python scripts/resign.py --config config.yml --check-only

      - name: Set up Java
        if: steps.check.outputs.needs_update == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.check.outputs.needs_update == 'true'
        uses: android-actions/setup-android@v4

      - name: Install apksigner
        if: steps.check.outputs.needs_update == 'true'
        run: |
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Prepare signing key
        if: steps.check.outputs.needs_update == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEYSTORE_BASE64:-}" ]]; then
            echo "Missing repository secret SIGNING_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Mirror new or changed releases
        if: steps.check.outputs.needs_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: python scripts/resign.py --config config.yml
